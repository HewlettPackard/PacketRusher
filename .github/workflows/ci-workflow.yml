name: PacketRusher Workflow
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install System Deps
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Install Go Deps
        run: go mod download
      - name: Build CLI
        run: go build -o packetrusher ./cmd
      - name: Run race suite
        run: go test -v -race ./... -timeout=180s

      - name: Run patched native NAS codec tests
        run: go test -v -race github.com/free5gc/nas/ie/... github.com/free5gc/nas/message/... github.com/free5gc/nas/internal/... -timeout=180s

  docker-smoke:
    name: Docker build and CLI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Build Docker image
        run: docker build -f docker/Dockerfile --target packetrusher -t packetrusher-ci .
      - name: Check container CLI
        run: |
          docker run --rm packetrusher-ci --help
          docker run --rm packetrusher-ci multi-ue --help
      - name: Validate Compose configurations
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tunnel.yml config --quiet
          docker compose -f docker/docker-compose.bridge.yml config --quiet
          docker compose -f docker/docker-compose.bridge.yml -f docker/docker-compose.tunnel.yml config --quiet
