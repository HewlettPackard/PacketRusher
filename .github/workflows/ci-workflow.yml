name: PacketRusher Workflow
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install System Deps
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Install Go Deps
        run: go mod download
      - name: Build CLI
        run: go build -o packetrusher ./cmd
      - name: Run race suite
        run: go test -v -race ./... -timeout=180s

      - name: Run patched native NAS codec tests
        run: go test -v -race github.com/free5gc/nas/ie/... github.com/free5gc/nas/message/... github.com/free5gc/nas/internal/... -timeout=180s
